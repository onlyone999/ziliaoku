<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>资源预览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: #fff; border-radius: 20px; padding: 40px; max-width: 500px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.2); text-align: center; }
.icon { font-size: 64px; margin-bottom: 20px; }
.title { font-size: 24px; font-weight: 800; color: #1a1a2e; margin-bottom: 10px; }
.desc { color: #666; line-height: 1.8; margin-bottom: 30px; }
.features { text-align: left; margin-bottom: 30px; }
.feature { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
.feature:last-child { border: none; }
.feature-icon { font-size: 20px; }
.feature-text { color: #333; font-size: 14px; }
.badge { display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; }
.footer { margin-top: 30px; color: #999; font-size: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📚</div>
  <h1 class="title">资料下载器</h1>
  <p class="desc">海量学习资源，一键下载，助力学习成长</p>
  <div class="features">
    <div class="feature"><span class="icon">📖</span><span class="feature-text">覆盖小学到大学全学段</span></div>
    <div class="feature"><span class="icon">🎯</span><span class="feature-text">考公考研考编资料齐全</span></div>
    <div class="feature"><span class="icon">💻</span><span class="feature-text">编程设计职场技能丰富</span></div>
    <div class="feature"><span class="icon">⬇️</span><span class="feature-text">支持在线预览和下载</span></div>
  </div>
  <div class="badge">立即体验</div>
  <div class="footer">资料下载器 © 2026</div>
</div>
</body>
</html>
