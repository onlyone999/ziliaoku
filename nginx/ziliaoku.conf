server {
    listen       9901;
    server_name  ziliaoku.local;

    root   E:/ziliaoku/backend;
    index  index.php index.html;

    # ============ 文件上传大小限制 ============
    client_max_body_size 100m;

    # ============ Gzip 压缩 ============
    gzip on;
    gzip_min_length  1k;
    gzip_comp_level  4;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-javascript image/svg+xml;
    gzip_vary on;
    gzip_proxied any;
    gzip_disable "MSIE [1-6]\.";

    # ============ 安全头 ============
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============ 主路由 ============
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ============ API 路由 ============
    location /api/ {
        fastcgi_pass   127.0.0.1:9001;
        fastcgi_param  SCRIPT_FILENAME  $document_root/api.php;
        fastcgi_param  REQUEST_URI      $request_uri;
        include        fastcgi_params;
    }

    # ============ 后台管理路由 ============
    location /admin/ {
        try_files $uri $uri/ /admin/index.php?$query_string;
    }

    location /admin/index.php {
        fastcgi_pass   127.0.0.1:9001;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        include        fastcgi_params;

        # 安全头 - 后台额外限制
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ============ 静态资源 - 上传文件 ============
    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin * always;
        try_files $uri =404;
    }

    # ============ PHP 处理 (支持 PATH_INFO) ============
    location ~ \.php(/|$) {
        fastcgi_pass   127.0.0.1:9001;
        fastcgi_index  index.php;

        # Split SCRIPT_FILENAME and PATH_INFO
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO        $fastcgi_path_info;
        include        fastcgi_params;

        # 超时设置 - 大文件上传场景
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout    300;
        fastcgi_read_timeout    300;

        # 缓冲设置
        fastcgi_buffer_size        128k;
        fastcgi_buffers            4 256k;
        fastcgi_busy_buffers_size  256k;
    }

    # ============ 禁止访问隐藏文件 ============
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============ 禁止访问敏感文件 ============
    location ~* \.(env|sql|bak|log|ini|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============ 静态资源缓存 ============
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ============ 日志 ============
    access_log  E:/ziliaoku/runtime/access.log;
    error_log   E:/ziliaoku/runtime/error.log warn;
}
